name: Publish to npm

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Prepare release version
        id: release
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/prepare-release.mjs
      - uses: actions/setup-node@v6
        if: steps.release.outputs.skip == 'false'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish package
        if: steps.release.outputs.skip == 'false'
        run: npm publish --tag ${{ github.event_name == 'pull_request' && 'canary' || 'latest' }}
      - name: Tag stable release
        if: github.event_name == 'push' && steps.release.outputs.skip == 'false'
        run: |
          git config user.name "Pavel Kondratov"
          git config user.email "p-kondratov@mail.ru"
          git tag "v${{ steps.release.outputs.version }}"
          git push origin "v${{ steps.release.outputs.version }}"
